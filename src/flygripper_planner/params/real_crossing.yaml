  plan_max_vel: 0.5
  plan_max_acc: 0.5
  plan_max_dyaw: 0.5
  plan_tolerance: 0.05
  morph_action: 1
  morph_trigger: 0
  morph_auto: true
  morph_tolerance: 0.1

task_1: # Reach the point before the gap, then close
  plan_type: 0
  plan_point_num: 1
  plan_point_0: {x: -0.85, y: -0.66, z: 0.72}
  plan_terminal_vel: {x: 0.0, y: 0.0, z: 0.0}
  plan_max_vel: 0.5
  plan_max_acc: 0.5
  plan_max_dyaw: 0.5
  plan_tolerance: 0.05
  morph_action: 2
  morph_trigger: 1
  morph_auto: false
  morph_tolerance: 0.1

task_2: # Pass the gap; open after reaching the point beyond it
  plan_type: 0
  plan_point_num: 1
  plan_point_0: {x: 0.12, y: -0.66, z: 0.72}
  plan_terminal_vel: {x: 0.0, y: 0.0, z: 0.0}
  plan_max_vel: 0.5
  plan_max_acc: 0.5
  plan_max_dyaw: 0.5
  plan_tolerance: 0.05
  morph_action: 1
  morph_trigger: 1
  morph_auto: false
  morph_tolerance: 0.1

task_3: # Fly to the final point with the gripper already open
  plan_type: 0
  plan_point_num: 1
  plan_point_0: {x: 1.12, y: -0.66, z: 0.72}
  plan_terminal_vel: {x: 0.0, y: 0.0, z: 0.0}
  plan_max_vel: 0.5
