#! /usr/bin/env python
PACKAGE='flygripper_planner'

from dynamic_reconfigure.parameter_generator_catkin import *
gen = ParameterGenerator()

#        Name                     Type        Level    Description                           Default      Min       Max
gen.add( "K",         int_t,         0,   "K",                         1, 1, 100)
gen.add( "M",         int_t,         0,   "M",                         1, 1, 100)
gen.add( "max_iteration",        int_t,      0,  "Max iterations.",          1, 0,  3000)
gen.add( "min_piece_num",         int_t,     0,  "Min piece number",            1, 0,  100)

wei = gen.add_group("Weights", "Weights of trajectory optimization")
wei.add( "rhoT",      double_t,      1,  "Weights of Time.",          1.0, 0,  100000000)
wei.add( "rhoV",      double_t,      1,  "Weights of Velocity.",      1.0, 0,  100000000)
wei.add( "rhoA",      double_t,      1,  "Weights of Acceleration.",  1.0, 0,  100000000)
wei.add( "rhoDYaw",   double_t,      1,  "Weights of Yaw Rate.",      1.0, 0,  100000000)

wei.add( "rhoPAlignmentDistance", double_t,      1,  "Weights of Position Alignment Distance.",      1.0, 0,  100000000)
wei.add( "rhoPAlignmentAngle",    double_t,      1,  "Weights of Position Alignment Angle.",         1.0, 0,  100000000)
wei.add( "rhoYawAlignmentAngle",  double_t,      1,  "Weights of Yaw Alignment Angle.",             1.0, 0,  100000000)

gen.add( "pause_debug",  bool_t,     0,      "bool to pause in debug mode",  True)
gen.add( "fix_p",        bool_t,     0,      "bool to fix p in debug mode",  False)

gen.add( "magic_number",         int_t,         0,   "magic_number",                         1, 0, 100)
# PkgName  #NodeName    #Prefix for generated .h include file, e.g. ParametersConfig.py
exit(gen.generate(PACKAGE,  "flygripper_planner",  "RosTrajOptParameter"))

