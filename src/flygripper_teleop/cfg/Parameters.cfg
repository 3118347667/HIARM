# 8Bitdo
# 8Bitdo controller axis list
#

# 8Bitdo Axes
#              1                      3
#              Λ                      Λ
#              |                      |
#              |                      |
#    0  <—— ——             2  <—— ——

axis_enum = gen.enum([
    gen.const("Axis_Disabled",      int_t, -1, ""),
    gen.const("Left_Stick_X",       int_t, 0,  "left/right"),
    gen.const("Left_Stick_Y",       int_t, 1,  "up/down"),
    gen.const("Right_Stick_X",      int_t, 2,  "left/right"),
    gen.const("Right_Stick_Y",      int_t, 3,  "up/down"),
    gen.const("D_Pad_Left_Right",   int_t, 4, ""),
    gen.const("D_Pad_Up_Down",      int_t, 5, "")
], "An enum to set axis index")

# 8Bitdo controller button list
button_enum = gen.enum([
    gen.const("Button_Disabled",    int_t, -1, ""),
    gen.const("A_Button",           int_t, 0,  ""),
    gen.const("B_Button",           int_t, 1,  ""),

    gen.const("X_Button",           int_t, 3,  ""),
    gen.const("Y_Button",           int_t, 4,  ""),

    gen.const("Left_Bumper",        int_t, 6,  ""),
    gen.const("Right_Bumper",       int_t, 7,  ""),
    gen.const("Left_Trigger",       int_t, 8,  ""),
    gen.const("Right_Trigger",      int_t, 9,  ""),
    gen.const("Select_Button",      int_t, 10, ""),
    gen.const("Start_Button",       int_t, 11, ""),
    gen.const("Hotkey_Button",      int_t, 12, ""),
    gen.const("Left_Stick_Click",   int_t, 13, ""),
    gen.const("Right_Stick_Click",  int_t, 14, ""),
], "An enum to set button index")


# TBS Tango2 Axes
#   3  <—— ——              0< —— ——
#            |                     |
#            |                     |
#            V 2                   V 1

# 8Bitdo Axes
#              1                      3
#              Λ                      Λ
#              |                      |
#              |                      |
#    0  <—— ——             2  <—— ——

# gen.add(name, type, level, description, default, min, max)
# set axis parameters
# mavros_msgs::RCIn
#                 2 THROTTLE                 1 PITCH
#                 Λ                          Λ
#                 |                          |
#                 |                          |
#     YAW 3 <—— ——              ROLL 0 <—— ——
gen.add("roll_axis",           int_t,  0, "", 0,  0, 5,  edit_method=axis_enum) # Right_Stick_X -> Rc channel 0
gen.add("roll_reverse",        bool_t, 0, "", False)
gen.add("pitch_axis",          int_t,  0, "", 1,  0, 5,  edit_method=axis_enum) # Right_Stick_Y -> Rc channel 1
gen.add("pitch_reverse",       bool_t, 0, "", False)
gen.add("throttle_axis",       int_t,  0, "", 2,  0, 5,  edit_method=axis_enum) # Left_Stick_Y  -> Rc channel 2
gen.add("throttle_reverse",    bool_t, 0, "", False)
gen.add("yaw_axis",            int_t,  0, "", 3,  0, 5,  edit_method=axis_enum) # Left_Stick_X  -> Rc channel 3
gen.add("yaw_reverse",         bool_t, 0, "", False)

# set button parameters
gen.add("arm_button",          int_t, 0, "", 0,  0, 14, edit_method=button_enum) # A_Button -> Rc channel 0
gen.add("disarm_button",       int_t, 0, "", 4,  0, 14, edit_method=button_enum) # Y_Button -> Rc channel 0
gen.add("takeoff_button",      int_t, 0, "", 3,  0, 14, edit_method=button_enum) # X_Button -> Rc channel 0
gen.add("land_button",         int_t, 0, "", 1,  0, 14, edit_method=button_enum) # B_Button -> Rc channel 0

gen.add("offborad_button",     int_t, 0, "", 6,  0, 14, edit_method=button_enum) # Left_Bumper -> Rc channel 0
gen.add("plan_button",         int_t, 0, "", 8,  0, 14, edit_method=button_enum) # Left_Trigger -> Rc channel 0
gen.add("kill_switch_button",  int_t, 0, "", 7,  0, 14, edit_method=button_enum) # Right_Bumper -> Rc channel 0

# set scaling parameters
linear_max = 1
angular_max = 1
gen.add("pub_rate",    double_t, 0, "the maximum publish rate", 100, 0.1, 200)
gen.add("expo",        double_t, 0, "improves control at low levels", 0.5, 0, 1)
gen.add("x_scaling",   double_t, 0, "linear scaling", 1, -linear_max, linear_max)
gen.add("y_scaling",   double_t, 0, "linear scaling", 1, -linear_max, linear_max)
gen.add("z_scaling",   double_t, 0, "linear scaling", 1, -linear_max, linear_max)
gen.add("wx_scaling",  double_t, 0, "angular scaling", 1, -angular_max, angular_max)
gen.add("wy_scaling",  double_t, 0, "angular scaling", 1, -angular_max, angular_max)
gen.add("wz_scaling",  double_t, 0, "angular scaling", -1, -angular_max, angular_max)

# generate the config headers
exit(gen.generate(PACKAGE, "teleop_joy_node", "Parameters"))