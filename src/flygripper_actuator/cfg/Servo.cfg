#! /usr/bin/env python
PACKAGE='flygripper_actuator'

from dynamic_reconfigure.parameter_generator_catkin import *
import math
gen = ParameterGenerator()

#        Name            Type      Level  Description                                 Default   Min       Max
gen.add( "reference_position" ,    int_t,  1,    "Servo reference position",    0,  -700,  0)

gen.add( "one_morphing_angle" ,    double_t,  1,    "One morphing servo angle",    0,  -12.5,  0)

mode_enum = gen.enum([ gen.const("DISABLE",         int_t, 0, "Control with rc"),
                       gen.const("PARAMETER",  int_t, 1, "Control with parameter"),
                       gen.const("CMD",        int_t, 2, "Control with command"),
                       gen.const("RC",         int_t, 3, "Control with rc")],
                     "An enum to set Teleoperation Mode type")

gen.add("teleop_mode",  int_t,     0, "A Teleoperation Mode parameter via an enum", 0, 0, 3, edit_method=mode_enum)

                 # PkgName  #NodeName        #Prefix for generated .h include file, e.g. servo.py
exit(gen.generate(PACKAGE, "flygripper_actuator", "Servo"))

