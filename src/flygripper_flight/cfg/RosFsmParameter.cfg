#! /usr/bin/env python
PACKAGE='flygripper_flight'

from dynamic_reconfigure.parameter_generator_catkin import *
gen = ParameterGenerator()

#        Name          Type      Level  Description                           Default   Min       Max

ctrl_enum = gen.enum([ gen.const("GEOMETRIC_CONTROLLER",  int_t, 0, "SE3 Geometric Controller"),
                       gen.const("NMPC_CONTROLLER",       int_t, 1, "Nonlinear Model Predictive Controller")],
                     "An enum to set controller type")

gen.add("controller",  int_t,     0, "A controller type parameter via an enum", 0, 0, 1, edit_method=ctrl_enum)

mode_enum = gen.enum([ gen.const("BODY_RATE_CUSTOMIZED",  int_t, 3, "Body Rate Customized"),
                       gen.const("SINGLE_ROTOR",  int_t, 2, "Single Rotor"),
                       gen.const("BODY_RATE",     int_t, 1, "Body Rate"),
                       gen.const("ATTITUDE",      int_t, 0, "Attitude")],
                     "An enum to set controller input")
gen.add("command_mode", int_t,    0, "A controller mode parameter via an enum", 2, 0, 3, edit_method=mode_enum)

gen.add("auto_takeoff",    bool_t,    0, "Take off from ground on CH5 after manual arming", False)
gen.add("takeoff_height",  double_t,  0, "Relative takeoff height [m], latched on entry",  0.5, 0.1, 4)

gen.add("traj_trigger",    bool_t,    0, "Traj mode with trigger",  True)

gen.add("velocity_teleop",      bool_t,    0, "Remote controller velocity teleoperation",  True)
gen.add("world_frame_velocity", bool_t,    0, "Remote controller velocity teleoperation in world frame",  True)

adm_enum = gen.enum([ gen.const("DISABLE",      int_t, 0, "BDISABLE"),
                       gen.const("ADMITTANCE",  int_t, 1, "ADMITTANCE"),
                       gen.const("ZERO_FORCE",  int_t, 2, "ZERO_FORCE")],
                     "An enum to set admittance mode")
gen.add("admittance_mode", int_t,    0, "The admittance mode parameter via an enum", 0, 0, 2, edit_method=adm_enum)
gen.add("enable_admittance_x",      bool_t,    0, "Enable admittance mode on X",  True)
gen.add("enable_admittance_y",      bool_t,    0, "Enable admittance mode on Y",  True)
gen.add("enable_admittance_z",      bool_t,    0, "Enable admittance mode on Z",  True)
gen.add("enable_admittance_yaw",    bool_t,    0, "Enable admittance mode on Yaw",  True)

gen.add("coeff_M_x",    double_t,  0, "Admittance coefficient M in x",  0.5, 0.0, 10)
gen.add("coeff_M_y",    double_t,  0, "Admittance coefficient M in y",  0.5, 0.0, 10)
gen.add("coeff_M_z",    double_t,  0, "Admittance coefficient M in z",  0.5, 0.0, 10)
gen.add("coeff_M_yaw",  double_t,  0, "Admittance coefficient M in yaw",  0.5, 0.0, 10)
gen.add("coeff_D_x",    double_t,  0, "Admittance coefficient D in x",  0.5, 0.0, 10)
gen.add("coeff_D_y",    double_t,  0, "Admittance coefficient D in y",  0.5, 0.0, 10)
gen.add("coeff_D_z",    double_t,  0, "Admittance coefficient D in z",  0.5, 0.0, 10)
gen.add("coeff_D_yaw",  double_t,  0, "Admittance coefficient D in yaw",  0.5, 0.0, 10)
gen.add("coeff_K_x",    double_t,  0, "Admittance coefficient K in x",  0.5, 0.0, 10)
gen.add("coeff_K_y",    double_t,  0, "Admittance coefficient K in y",  0.5, 0.0, 10)
gen.add("coeff_K_z",    double_t,  0, "Admittance coefficient K in z",  0.5, 0.0, 10)
gen.add("coeff_K_yaw",  double_t,  0, "Admittance coefficient K in yaw",  0.5, 0.0, 10)

gen.add("admittance_max_vel_x",    double_t,  0, "Admittance max velocity in x",  0.5, 0.0, 10)
gen.add("admittance_max_vel_y",    double_t,  0, "Admittance max velocity in y",  0.5, 0.0, 10)
gen.add("admittance_max_vel_z",    double_t,  0, "Admittance max velocity in z",  0.5, 0.0, 10)
gen.add("admittance_max_vel_yaw",  double_t,  0, "Admittance max velocity in yaw", 0.5, 0.0, 10)
gen.add("admittance_max_acc_x",    double_t,  0, "Admittance max acceleration in x",  0.5, 0.0, 10)
gen.add("admittance_max_acc_y",    double_t,  0, "Admittance max acceleration in y",  0.5, 0.0, 10)
gen.add("admittance_max_acc_z",    double_t,  0, "Admittance max acceleration in z",  0.5, 0.0, 10)
gen.add("admittance_max_acc_yaw",  double_t,  0, "Admittance max acceleration in yaw", 0.5, 0.0, 10);

gen.add("external_force_threshold",           double_t,  0, "External force threshold",  0.5, 0.0, 10)
gen.add("external_torque_threshold",           double_t,  0, "External torque threshold",  0.5, 0.0, 10)
gen.add("external_wrench_trigger_duration",    double_t,  0, "External wrench trigger duration",  0.5, 0.0, 1.0)
gen.add("external_wrench_cutoff_frequency",    double_t,  0, "External wrench cutoff frequency",  3.0, 0.0, 30.0)

                 # PkgName  #NodeName    #Prefix for generated .h include file, e.g. ParametersConfig.py
exit(gen.generate(PACKAGE,  PACKAGE,      "RosFsmParameter"))

