#! /usr/bin/env python
PACKAGE='flygripper_common'

from dynamic_reconfigure.parameter_generator_catkin import *
gen = ParameterGenerator()

#        Name                     Type        Level    Description                           Default      Min       Max
gen.add( "mass",                  double_t,     1,      "Mass [kg].",                         1.0,         0,  10.0)

ine = gen.add_group("inertia", "Inertia parameters.")
ine.add( "inertia_x",             double_t,     1,      "Inertia xx.",                        0.03,       0,  1.0)
ine.add( "inertia_y",             double_t,     1,      "Inertia yy.",                        0.03,       0,  1.0)
ine.add( "inertia_z",             double_t,     1,      "Inertia zz.",                        0.06,       0,  1.0)

aer = gen.add_group("aerodynamic model", "Aerodynamic parameters.")
aer.add( "thrust_coeff",          double_t,      1,     "Thrust coefficient.",                6.56145e-7, 0,  1e-5)
aer.add( "moment_coeff",          double_t,      1,     "Moment coefficient.",                1.03015e-7, 0,  1e-5)

con = gen.add_group("constraints", "Constraint parameters.")
con.add( "velocity_max",          double_t,      1,     "Velocity Max.",                       1.0,       0,  5)
con.add( "acceleration_max",      double_t,      1,     "Max Acceleration.",                   2.0,       0,  10)
con.add( "tilt_angle_max",        double_t,      1,     "Tilt Angle Max.",                     3.14,      0,  3.14)

thr = con.add_group("thrust max constraints", "Max Torque Parameters.")
thr.add( "collective_thrust_min", double_t,      1,     "Collective Thrust Min.",              1.0,       0,  20)
thr.add( "collective_thrust_max", double_t,      1,     "Collective Thrust Max.",              1.0,       0,  200)

bod = con.add_group("bodyrates max constraints", "Max Bodyrates Parameters.")
bod.add( "bodyrates_max_x",       double_t,      1,     "Bodyrates Roll Max.",                 1.57,      0,  20)
bod.add( "bodyrates_max_y",       double_t,      1,     "Bodyrates Pitch Max.",                1.57,      0,  20)
bod.add( "bodyrates_max_z",       double_t,      1,     "Bodyrates Yaw Max.",                  1.57,      0,  20)

tor = con.add_group("torque max constraints", "Max Torque Parameters.")
tor.add( "torque_max_x",       double_t,      1,     "Torque Roll Max.",                 0.3,      0,  2)
tor.add( "torque_max_y",       double_t,      1,     "Torque Pitch Max.",                0.3,      0,  2)
tor.add( "torque_max_z",       double_t,      1,     "Torque Yaw Max.",                  0.1,      0,  2)

gen.add( "dynamic_mixing",         bool_t,       1,     "Dynamic mixing flag.",            False)

ctrl_enum = gen.enum([ gen.const("WITHOUT_VOLT_CURVE_FIT",  int_t, 0, "WITHOUT_VOLT_CURVE_FIT"),
                       gen.const("WITH_VOLT_CURVE_FIT",     int_t, 1, "WITH_VOLT_CURVE_FIT"),
                       gen.const("WITH_VOLT_LOOKUP_TABLE",  int_t, 2, "WITH_VOLT_LOOKUP_TABLE")],
                     "An enum to set controller type")

gen.add("dshot_rpm_map_method",  int_t,     1, "A dshot rpm mapping method type parameter via an enum", 0, 0, 2, edit_method=ctrl_enum)

gen.add("hover_percentage",      double_t,  1, "Hover Percentage.",                 0.3,    0,  1)
# PkgName  #NodeName    #Prefix for generated .h include file, e.g. ParametersConfig.py
exit(gen.generate(PACKAGE,  PACKAGE,  "RosRobotParameter"))

